<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Smartphone Outer Frame -->
  <rect x="146" y="76" width="220" height="360" rx="42" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Phone Screen with subtle reflection -->
  <rect x="162" y="92" width="188" height="328" rx="28" fill="url(#screenGrad)"/>

  <!-- Speaker / Dynamic Island Top -->
  <rect x="232" y="118" width="48" height="12" rx="6" fill="#ffffff"/>

  <!-- Home Indicator Bar Bottom -->
  <rect x="226" y="380" width="60" height="12" rx="6" fill="#ffffff"/>

  <!-- Modern Bolt / Spark inside screen -->
  <path d="M266 186 L232 254 H268 L246 318 L282 244 H248 Z" fill="#ffffff"/>
</svg>